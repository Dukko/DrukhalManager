[package]
name = "drukhal-manager"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "Native Linux mod manager for Stellaris, a fork of Irony Mod Manager"
repository = "https://github.com/Dukko/DrukhalManager"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_6"] }
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
