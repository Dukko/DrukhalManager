[workspace]
members = ["core"]
# `cargo build`, `test` and `clippy` at the root cover both.
default-members = [".", "core"]
# Mockups, each its own crate.
exclude = ["prototypes"]

[workspace.package]
version = "3.0.0-beta.2"
edition = "2024"
license = "MIT"

[package]
name = "drukhal-manager"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stellaris mod manager for Linux and Windows, a fork of Irony Mod Manager"
repository = "https://github.com/Dukko/DrukhalManager"

[dependencies]
drukhal-core = { path = "core" }
# The interface: iced, the toolkit COSMIC is built on. wgpu draws it, with
# tiny-skia in software where there's no GPU.
iced = { version = "0.14.0", features = ["svg", "tokio"] }
tokio = { version = "1", features = ["time"] }
# Following the desktop's colours: matugen's gtk.css, Omarchy's theme.
notify = "9.0.0"
# --screenshot, for the docs and checking layouts without a display.
image = { version = "0.25", default-features = false, features = ["png"] }

# The icon and version details of the Windows .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Smaller, faster release builds (Flatpak, Windows zip, AUR) for a longer
# build. Symbol names stay so backtraces in bug reports are readable.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
