[package]
name = "drukhal-manager"
version = "2.7.39"
edition = "2024"
license = "MIT"
description = "Stellaris mod manager for Linux and Windows, a fork of Irony Mod Manager"
repository = "https://github.com/Dukko/DrukhalManager"

[dependencies]
# Loading the bundled fonts (src/theme.rs): Pango 1.56.
pango = { version = "0.22.9", features = ["v1_56"] }
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_8"] }
async-channel = "2.5.0"
dirs = "7.0.0"
formatx = "0.4.2"
fs4 = "1.1.0"
gettext-rs = { version = "0.8.0", features = ["gettext-system"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
shlex = "2.0.1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }
zip = { version = "9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# The system keyring: the Secret Service (or the Secret portal in the
# Flatpak) on Linux, Credential Manager on Windows.
[target.'cfg(unix)'.dependencies]
futures-lite = "2.6.1"
oo7 = { version = "0.7.0", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(windows)'.dependencies]
keyring-core = "1.0.1"
windows-native-keyring-store = "1.1.0"
windows-registry = "0.100.0"

# The icon and version details of the Windows .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

# Smaller, faster release builds (Flatpak, Windows zip, AUR) for a longer
# build. Symbol names stay so backtraces in bug reports are readable.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
