[package]
name = "drukhal-slint-resolve"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Mockup: DrukhalManager's conflict view in Slint"

[dependencies]
drukhal-palette = { path = "../palette" }
drukhal-sample-data = { path = "../sample-data" }
slint = "1.19.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.19.1"

[profile.release]
opt-level = 3
