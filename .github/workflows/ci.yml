name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: build, test, clippy
    runs-on: ubuntu-latest
    # ubuntu-24.04 ships GTK 4.14 / libadwaita 1.5, too old for the
    # gtk4 v4_14 + libadwaita v1_8 feature gates. Fedora 43 has new
    # enough system headers, so run the job inside that container.
    container:
      image: fedora:43
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc pkg-config \
            gtk4-devel libadwaita-devel \
            git ca-certificates
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --all-targets --locked
      - name: Keep non-UI code free of GTK
        # So a native Windows UI could reuse it later (#153).
        run: |
          if grep -rnE '\b(gtk|adw|glib|gio)::' src/merge src/mods src/paradox src/platform.rs src/settings.rs src/secrets.rs src/diagnostics.rs src/multiplayer.rs src/dds.rs src/diff.rs; then
            echo "::error::GTK used outside the UI; go through src/platform.rs instead"
            exit 1
          fi

  windows:
    name: build, test, clippy (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      # GTK, libadwaita and a GNU-target Rust from MSYS2's UCRT64 environment.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-rust
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --all-targets --locked
