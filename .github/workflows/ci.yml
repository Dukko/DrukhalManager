name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: build, test, clippy
    runs-on: ubuntu-latest
    # iced loads the windowing and graphics libraries at run time, so the
    # build only needs a C compiler and gettext (msgfmt, and libintl for
    # gettext-rs).
    container:
      image: fedora:43
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc pkg-config \
            gettext gettext-devel \
            git ca-certificates
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --locked
      - name: cargo test
        run: cargo test --locked
      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Translation template is current
        run: |
          cargo install xtr --version 0.1.11 --locked
          po/check-pot.sh
          po/check-placeholders.sh
      - name: Keep the core free of UI toolkits
        # drukhal-core is everything but the window; the interface is built
        # on it, so it must not pull a toolkit in.
        run: |
          if cargo tree --locked -p drukhal-core -e normal --prefix none | grep -E '^(iced|winit|wgpu|gtk4|libadwaita|glib) '; then
            echo "::error::drukhal-core depends on a UI toolkit; keep UI code in src/"
            exit 1
          fi

  packaging:
    name: packaging files are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # flatpak.yml runs this only on tags, so a stale file would get green
      # PRs and fail after the release tag was pushed.
      - name: Check cargo-sources.json matches Cargo.lock
        run: |
          python3 flatpak/generate-cargo-sources.py Cargo.lock "$RUNNER_TEMP/cargo-sources.json"
          diff -q flatpak/cargo-sources.json "$RUNNER_TEMP/cargo-sources.json" || {
            echo "::error::flatpak/cargo-sources.json is stale; regenerate it (see flatpak/generate-cargo-sources.py)"
            exit 1
          }

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

# The Windows job lives in windows-ci.yml and runs only when started by hand.

