name: Windows bundle

# Builds DrukhalManager for Windows with the GTK it runs on
# (packaging/windows/bundle.sh), checks it starts outside MSYS2 and uploads
# the folder as an artifact to try out. Runs by hand, on PRs that touch the
# packaging, and on a version tag. It also builds the installer
# (packaging/windows/DrukhalManager.iss). For a tag it attaches
# DrukhalManager-setup-x64.exe and DrukhalManager-windows-x64.zip to the
# release. tag.yml calls it with the tag it just made, since tags pushed by
# a workflow don't start other workflows.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build
        type: string
        required: true
  pull_request:
    paths:
      - packaging/windows/**
      - build.rs
      - .github/workflows/windows-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-librsvg
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-gettext
            mingw-w64-ucrt-x86_64-rust
      - name: Bundle
        run: packaging/windows/bundle.sh target/windows-bundle/DrukhalManager
      - name: Show the loader cache
        run: grep '^"' target/windows-bundle/DrukhalManager/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache
      # Without MSYS2 on PATH, a missing DLL stops the app at once. Still
      # running after a while means it got as far as its window.
      - name: Starts outside MSYS2
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $app = Start-Process -PassThru -FilePath target\windows-bundle\DrukhalManager\bin\DrukhalManager.exe
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Write-Error ("DrukhalManager exited with code 0x{0:X8}" -f $app.ExitCode)
            exit 1
          }
          Stop-Process -Id $app.Id -Force
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches.Groups[1].Value
          & $iscc /Qp "/DAppVersion=$version" "/DBundleDir=$PWD\target\windows-bundle\DrukhalManager" "/O$PWD\target\installer" packaging\windows\DrukhalManager.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Installer installs and uninstalls
        shell: pwsh
        run: |
          $setup = Start-Process -Wait -PassThru target\installer\DrukhalManager-setup-x64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($setup.ExitCode) { throw "Setup exited with code $($setup.ExitCode)" }
          $dir = "$env:LOCALAPPDATA\Programs\DrukhalManager"
          if (-not (Test-Path "$dir\bin\DrukhalManager.exe")) { throw "Not installed in $dir" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\DrukhalManager.lnk")) { throw "No Start menu shortcut" }
          # The uninstaller hands over to a copy of itself and returns at once.
          Start-Process -Wait "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\bin"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\bin") { throw "Still installed after uninstalling" }
      - uses: actions/upload-artifact@v4
        with:
          name: DrukhalManager-windows
          path: target/windows-bundle
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DrukhalManager-windows-installer
          path: target/installer/DrukhalManager-setup-x64.exe
          if-no-files-found: error

  attach:
    needs: bundle
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DrukhalManager-windows
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: DrukhalManager-windows-installer
      - name: Zip
        run: cd bundle && zip -qr9 ../DrukhalManager-windows-x64.zip DrukhalManager
      # The Flatpak release workflow creates the release with its notes;
      # wait for it rather than create one without them.
      - name: Attach the zip and the installer to the release
        run: |
          for _ in $(seq 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" DrukhalManager-windows-x64.zip DrukhalManager-setup-x64.exe --clobber
              exit 0
            fi
            sleep 30
          done
          echo "::error::No release for $TAG after 30 minutes"
          exit 1
